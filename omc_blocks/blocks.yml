info:
  namespace: omc_blocks
items:
  aywenite_ore:
    display_name: §dMinerais d'Aywenite
    permission: aywenite
    lore:
      - "§7Une découverte surprenante"
    resource:
      generate: true
      material: PAPER
      textures:
        - aywenite_ore.png
    specific_properties:
      block:
        drop_when_mined: false
        placed_model:
          type: REAL_NOTE
          break_particles: ITEM
        break_tools_whitelist:
          - DIAMOND_PICKAXE
          - NETHERITE_PICKAXE
        hardness: 2
        no_explosion: false
        sound:
          break:
            name: BLOCK_STONE_BREAK
            volume: 1
            pitch: 1
          place:
            name: BLOCK_STONE_PLACE
            volume: 1
            pitch: 1
    events:
      placed_block:
        break:
          drop_item:
            item: omc_items:aywenite
            min_amount: 1
            max_amount: 2
            chance: 100
          drop_exp:
            chance: 100
            min_amount: 1
            max_amount: 3
